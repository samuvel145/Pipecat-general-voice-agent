<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLL Voice Agent Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 14px;
        }
        .status.disconnected {
            background: #fee;
            color: #c33;
        }
        .status.connecting {
            background: #fef3cd;
            color: #856404;
        }
        .status.connected {
            background: #d4edda;
            color: #155724;
        }
        .status.active {
            background: #cce5ff;
            color: #004085;
        }
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #connectBtn {
            background: #667eea;
            color: white;
        }
        #connectBtn:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
        }
        #startBtn {
            background: #48bb78;
            color: white;
        }
        #startBtn:hover:not(:disabled) {
            background: #38a169;
            transform: translateY(-2px);
        }
        #stopBtn {
            background: #f56565;
            color: white;
        }
        #stopBtn:hover:not(:disabled) {
            background: #e53e3e;
            transform: translateY(-2px);
        }
        .logs {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-radius: 5px;
        }
        .log-entry.info {
            background: #e3f2fd;
            color: #0d47a1;
        }
        .log-entry.error {
            background: #ffebee;
            color: #b71c1c;
        }
        .log-entry.success {
            background: #e8f5e9;
            color: #1b5e20;
        }
        .audio-indicator {
            display: none;
            margin-top: 15px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 10px;
        }
        .audio-indicator.show {
            display: block;
        }
        .audio-indicator.recording {
            background: #fee;
            color: #c33;
        }
        .audio-indicator.playing {
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ JLL Voice Agent</h1>
        <p class="subtitle">Test your voice agent in the browser</p>
        
        <div id="status" class="status disconnected">Disconnected</div>
        
        <div class="button-group">
            <button id="connectBtn">Connect</button>
        </div>
        
        <div class="button-group">
            <button id="startBtn" disabled>Start Call</button>
            <button id="stopBtn" disabled>Stop Call</button>
        </div>
        
        <div id="audioIndicator" class="audio-indicator">
            <span id="audioStatus">Ready</span>
        </div>
        
        <div class="logs" id="logs"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
